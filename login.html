<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Land to Yield</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #060f1e;
      --surface:     #0d1f3c;
      --surface-2:   #112444;
      --border:      #1e3a5f;
      --primary:     #22c55e;
      --primary-dim: #16a34a;
      --accent:      #3b82f6;
      --text:        #e2e8f0;
      --text-muted:  #94a3b8;
      --error:       #f87171;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background-image:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(34,197,94,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(59,130,246,0.06) 0%, transparent 50%);
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    }

    .logo-wrap {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo-icon {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.9rem;
      box-shadow: 0 0 24px rgba(34,197,94,0.35);
    }

    .logo-icon svg { width: 28px; height: 28px; }

    .logo-name {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      display: block;
    }

    .logo-tagline {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    h2 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
      color: var(--text);
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1.75rem;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 0.45rem;
    }

    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      font-family: 'SF Mono', 'Fira Code', monospace;
      letter-spacing: 0.08em;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 1.25rem;
    }

    input[type="password"]:focus, input[type="text"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(34,197,94,0.12);
    }

    .show-toggle {
      position: relative;
    }

    .show-toggle input { padding-right: 3rem; margin-bottom: 0; }

    .show-btn {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 0.25rem;
    }
    .show-btn:hover { color: var(--text); }

    .spacer { margin-bottom: 1.25rem; }

    .btn {
      width: 100%;
      padding: 0.8rem;
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      letter-spacing: 0.01em;
      margin-top: 0.25rem;
    }

    .btn:hover:not(:disabled) { opacity: 0.92; }
    .btn:active:not(:disabled) { transform: scale(0.99); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #errorMsg {
      display: none;
      background: rgba(248,113,113,0.1);
      border: 1px solid rgba(248,113,113,0.3);
      color: var(--error);
      border-radius: 8px;
      padding: 0.65rem 0.9rem;
      font-size: 0.85rem;
      margin-top: 1rem;
      line-height: 1.4;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1.75rem 0 1.25rem;
    }

    .footer-links {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.8;
    }

    .footer-links a {
      color: var(--accent);
      text-decoration: none;
    }

    .footer-links a:hover { text-decoration: underline; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 2rem;
      letter-spacing: 0.03em;
    }
    .badge::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 6px var(--primary);
    }
  </style>
</head>
<body>

<div class="card">
  <div class="logo-wrap">
    <div class="logo-icon">
      <!-- Sprout / yield icon -->
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22V12"/>
        <path d="M12 12C12 7 7 4 3 5c0 5 3 9 9 7z"/>
        <path d="M12 12C12 7 17 4 21 5c0 5-3 9-9 7z"/>
      </svg>
    </div>
    <span class="logo-name">Land to Yield</span>
    <div class="logo-tagline">Highest &amp; Best Use · LA County</div>
  </div>

  <h2>Sign in to your portal</h2>
  <p class="subtitle">Enter the access token you received after subscribing.</p>

  <form id="loginForm" onsubmit="handleSubmit(event)">
    <label for="tokenInput">Access Token</label>
    <div class="show-toggle">
      <input
        type="password"
        id="tokenInput"
        placeholder="Paste your token here"
        autocomplete="current-password"
        spellcheck="false"
        required
      >
      <button type="button" class="show-btn" onclick="toggleShow()">Show</button>
    </div>
    <div class="spacer"></div>
    <button type="submit" class="btn" id="submitBtn">Sign In</button>
    <div id="errorMsg"></div>
  </form>

  <hr class="divider">

  <div class="footer-links">
    Don't have access?
    <a href="https://landtoyield.com/#pricing" target="_blank">View plans &amp; pricing</a>
    <br>
    Need help?
    <a href="mailto:trevor@clscre.com">Contact support</a>
  </div>
</div>

<div class="badge">Secured · Land to Yield v4.7</div>

<script>
  // Read the ?from= param so we can redirect back after login
  var redirectTo = '/app.html';
  try {
    var params = new URLSearchParams(window.location.search);
    var from = params.get('from');
    if (from && /^\/[a-zA-Z0-9._/-]*$/.test(from)) {
      redirectTo = from;
    }
  } catch(e) {}

  function toggleShow() {
    var inp = document.getElementById('tokenInput');
    var btn = document.querySelector('.show-btn');
    if (inp.type === 'password') {
      inp.type = 'text';
      btn.textContent = 'Hide';
    } else {
      inp.type = 'password';
      btn.textContent = 'Show';
    }
  }

  async function handleSubmit(e) {
    e.preventDefault();
    var token = document.getElementById('tokenInput').value.trim();
    var btn = document.getElementById('submitBtn');
    var err = document.getElementById('errorMsg');

    err.style.display = 'none';
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Verifying…';

    try {
      var res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: token })
      });

      if (res.ok) {
        btn.innerHTML = '✓ Authenticated — redirecting…';
        setTimeout(function() { window.location.href = redirectTo; }, 400);
      } else if (!(res.headers.get('content-type') || '').includes('application/json')) {
        // Static hosting (no serverless API) — validate what we can locally
        staticLogin(token, btn);
      } else {
        var data = await res.json().catch(function() { return {}; });
        showError(data.error || 'Invalid access token. Please check and try again.');
        btn.disabled = false;
        btn.innerHTML = 'Sign In';
      }
    } catch(ex) {
      staticLogin(token, btn);
    }
  }

  // Static-hosting fallback: check trial-token expiry locally, set the
  // auth cookie client-side, and continue to the requested page.
  function staticLogin(token, btn) {
    var m = token.match(/^lty-trial-(\d{8})-([0-9a-f]{16})$/);
    if (m) {
      var today = new Date().toISOString().slice(0, 10).replace(/-/g, '');
      if (today > m[1]) {
        showError('This trial token has expired. Email trevor@clscre.com to extend your access.');
        btn.disabled = false;
        btn.innerHTML = 'Sign In';
        return;
      }
    } else if (!token) {
      showError('Access token is required');
      btn.disabled = false;
      btn.innerHTML = 'Sign In';
      return;
    }
    document.cookie = 'lty_auth=' + encodeURIComponent(token) +
      '; max-age=' + (60 * 60 * 24 * 30) + '; path=/; SameSite=Lax; Secure';
    btn.innerHTML = '✓ Authenticated — redirecting…';
    setTimeout(function() { window.location.href = redirectTo; }, 400);
  }

  function showError(msg) {
    var err = document.getElementById('errorMsg');
    err.textContent = msg;
    err.style.display = 'block';
  }
</script>
</body>
</html>
