<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e3a5f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.05">
    <line x1="0" y1="0" x2="1200" y2="630" stroke="white" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="1200" y2="400" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="800" y2="630" stroke="white" stroke-width="0.5"/>
  </g>

  <!-- City skyline silhouette -->
  <g fill="#1e293b" opacity="0.4">
    <rect x="50" y="420" width="60" height="210"/>
    <rect x="120" y="380" width="45" height="250"/>
    <rect x="175" y="350" width="70" height="280"/>
    <rect x="255" y="400" width="50" height="230"/>
    <rect x="315" y="320" width="55" height="310"/>
    <rect x="380" y="370" width="40" height="260"/>
    <rect x="430" y="340" width="80" height="290"/>
    <rect x="520" y="390" width="50" height="240"/>
    <rect x="580" y="300" width="65" height="330"/>
    <rect x="655" y="360" width="45" height="270"/>
    <rect x="710" y="330" width="75" height="300"/>
    <rect x="795" y="380" width="55" height="250"/>
    <rect x="860" y="350" width="60" height="280"/>
    <rect x="930" y="400" width="45" height="230"/>
    <rect x="985" y="310" width="70" height="320"/>
    <rect x="1065" y="370" width="50" height="260"/>
    <rect x="1125" y="340" width="75" height="290"/>
  </g>

  <!-- Brand name -->
  <text x="600" y="200" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="72" font-weight="900" fill="white" text-anchor="middle" letter-spacing="-3">
    Land <tspan fill="#fbbf24">to</tspan> Yield
  </text>

  <!-- Divider line -->
  <rect x="540" y="230" width="120" height="3" rx="1.5" fill="#fbbf24" opacity="0.8"/>

  <!-- Tagline -->
  <text x="600" y="290" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="500" fill="rgba(255,255,255,0.85)" text-anchor="middle">
    Instant HBU Analysis for LA County
  </text>

  <!-- Subtitle -->
  <text x="600" y="340" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="400" fill="rgba(255,255,255,0.5)" text-anchor="middle">
    What consultants charge thousands for, delivered in seconds.
  </text>

  <!-- Feature badges -->
  <g transform="translate(600, 400)" text-anchor="middle">
    <rect x="-280" y="-18" width="140" height="36" rx="18" fill="#2563eb" opacity="0.3"/>
    <text x="-210" y="6" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#93c5fd">27-Tab Analysis</text>

    <rect x="-70" y="-18" width="140" height="36" rx="18" fill="#2563eb" opacity="0.3"/>
    <text x="0" y="6" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#93c5fd">SB 79 Transit</text>

    <rect x="140" y="-18" width="140" height="36" rx="18" fill="#2563eb" opacity="0.3"/>
    <text x="210" y="6" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#93c5fd">Pro Forma</text>
  </g>

  <!-- URL -->
  <text x="600" y="570" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.35)" text-anchor="middle">
    landtoyield.com
  </text>
</svg>
